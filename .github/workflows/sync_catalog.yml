name: Sync and Split Rust Catalog

on:
  # Runs automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allows you to trigger it manually anytime from the "Actions" tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout YOUR repository where JSON chunks will be saved
      - name: Checkout target repository
        uses: actions/checkout@v4

      # 2. Clone your friend's public Rust repository into a temporary folder
      - name: Clone upstream Rust repository
        run: |
          git clone --depth 1 https://github.com/<FRIEND_USERNAME>/<FRIEND_REPO>.git upstream_repo

      # 3. Install Rust toolchain (with caching so future runs are fast)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream_repo

      # 4. Run the Rust binary to generate the raw JSON file
      - name: Run Rust generator
        working-directory: upstream_repo
        run: |
          cargo run --release -- --output ../raw_output.json

      # 5. Split the raw JSON into <= 23 MB chunks inside ./data/
      - name: Split JSON into chunks
        run: |
          rm -rf data
          python3 split_json.py raw_output.json data 23
          rm -f raw_output.json

      # 6. Commit and push the updated JSON chunks to your repo
      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update split catalog JSON chunks"
            git push
          fi
